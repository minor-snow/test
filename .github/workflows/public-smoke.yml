name: Public CLI Conformance Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm ci

      - name: Syntax and Conformance Checks
        run: vitest run --mode=syntax

      - name: Download Pantheon CLI Binary
        run: |
          # Normally this would curl a public release or 'npm install -g pantheon-alpha'
          # Here we just mock the presence of a binary since it's a closed engine.
          echo "Simulating binary availability"
          
      - name: Run Public Smoke
        if: env.CLARION_BIN != ''
        run: npm run test
        env:
          CLARION_BIN: ${{ env.CLARION_BIN }}
