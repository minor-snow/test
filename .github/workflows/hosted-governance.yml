name: Pantheon Hosted Governance Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hosted-matrix:
    if: >
      startsWith(github.head_ref, 'std/') ||
      startsWith(github.head_ref, 'chg/') ||
      startsWith(github.head_ref, 'rep/') ||
      startsWith(github.head_ref, 'arch/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scenario
        id: scenario
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF}"
          echo "scenario_id=${ref//\//-}" >> "$GITHUB_OUTPUT"
          echo "config_path=pantheon.alpha.json" >> "$GITHUB_OUTPUT"
          echo "artifact_mode=public" >> "$GITHUB_OUTPUT"
          echo "post_comment=true" >> "$GITHUB_OUTPUT"
          echo "audit_mode=auto" >> "$GITHUB_OUTPUT"

          {
            echo "scope<<__PANTHEON__"
            printf '%s\n' \
              'src/**' \
              'test/**' \
              'tests/**' \
              'docs/**' \
              'package.json' \
              'AGENTS.md' \
              'pantheon.json' \
              'pantheon.alpha.json' \
              '.pantheon/architecture/**'
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "review<<__PANTHEON__"
            printf '%s\n' \
              'src/auth/**' \
              'package.json' \
              '.pantheon/architecture/**' \
              '.github/workflows/**'
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "forbid<<__PANTHEON__"
            printf '%s\n' \
              '.pantheon/audit/**' \
              '.pantheon/reviews/**' \
              '.pantheon/change/**' \
              '.pantheon/repair/**'
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          case "$ref" in
            std/*)
              echo "mode=boundary" >> "$GITHUB_OUTPUT"
              echo "fail_on=all" >> "$GITHUB_OUTPUT"
              ;;
            chg/*)
              echo "mode=change" >> "$GITHUB_OUTPUT"
              echo "change_id=chg_ed1c4bbf7e6138e8" >> "$GITHUB_OUTPUT"
              echo "fail_on=fail,requires_contract,requires_replan,requires_scope_expansion,sanitizer_violation" >> "$GITHUB_OUTPUT"
              ;;
            rep/r2-*)
              echo "mode=repair" >> "$GITHUB_OUTPUT"
              echo "repair_id=repair_aaa1111111111111" >> "$GITHUB_OUTPUT"
              echo "fail_on=fail,requires_replan,requires_scope_expansion,sanitizer_violation" >> "$GITHUB_OUTPUT"
              ;;
            rep/*)
              echo "mode=repair" >> "$GITHUB_OUTPUT"
              echo "repair_intent=Fix formatting regression in formatValue" >> "$GITHUB_OUTPUT"
              {
                echo "suspect<<__PANTHEON__"
                printf '%s\n' 'src/utils/format.ts'
                echo "__PANTHEON__"
              } >> "$GITHUB_OUTPUT"
              {
                echo "failing_tests<<__PANTHEON__"
                printf '%s\n' 'tests/utils/format.test.ts'
                echo "__PANTHEON__"
              } >> "$GITHUB_OUTPUT"
              echo "fail_on=fail,requires_replan,requires_scope_expansion,sanitizer_violation" >> "$GITHUB_OUTPUT"
              ;;
            arch/*)
              echo "mode=change" >> "$GITHUB_OUTPUT"
              echo "change_id=chg_9403d049d4ce4563" >> "$GITHUB_OUTPUT"
              echo "fail_on=fail,requires_contract,requires_replan,requires_scope_expansion,sanitizer_violation" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown hosted scenario branch: $ref" >&2
              exit 1
              ;;
          esac

      - name: Run Pantheon governance gate
        id: pantheon
        uses: ./action
        with:
          mode: ${{ steps.scenario.outputs.mode }}
          change_id: ${{ steps.scenario.outputs.change_id }}
          repair_id: ${{ steps.scenario.outputs.repair_id }}
          repair_intent: ${{ steps.scenario.outputs.repair_intent }}
          suspect: ${{ steps.scenario.outputs.suspect }}
          failing_tests: ${{ steps.scenario.outputs.failing_tests }}
          scope: ${{ steps.scenario.outputs.scope }}
          review: ${{ steps.scenario.outputs.review }}
          forbid: ${{ steps.scenario.outputs.forbid }}
          config_path: ${{ steps.scenario.outputs.config_path }}
          fail_on: ${{ steps.scenario.outputs.fail_on }}
          artifact_mode: ${{ steps.scenario.outputs.artifact_mode }}
          post_comment: ${{ steps.scenario.outputs.post_comment }}
          audit_mode: ${{ steps.scenario.outputs.audit_mode }}

      - name: Resolve artifact dir
        if: always()
        id: artifacts
        shell: bash
        run: |
          dir="${{ steps.pantheon.outputs.artifact_dir }}"
          if [ -z "$dir" ]; then
            if [ -d pantheon-repair-report ]; then
              dir="pantheon-repair-report"
            else
              dir="pantheon-report"
            fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload hosted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.scenario.outputs.scenario_id }}
          path: ${{ steps.artifacts.outputs.dir }}
