name: Pantheon Hosted Governance Matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hosted-matrix:
    if: >
      startsWith(github.head_ref, 'std/') ||
      startsWith(github.head_ref, 'chg/') ||
      startsWith(github.head_ref, 'rep/') ||
      startsWith(github.head_ref, 'arch/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Resolve scenario
        id: scenario
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF}"
          mode=""
          fail_on=""
          change_id=""
          repair_id=""
          repair_intent=""
          scope_lines=(
            'src/**'
            'test/**'
            'tests/**'
            'docs/**'
            'package.json'
            'AGENTS.md'
            'pantheon.json'
            'pantheon.alpha.json'
            '.pantheon/architecture/**'
          )
          review_lines=(
            'src/auth/**'
            'package.json'
            '.pantheon/architecture/**'
            '.github/workflows/**'
          )
          forbid_lines=(
            '.pantheon/audit/**'
            '.pantheon/reviews/**'
            '.pantheon/change/**'
            '.pantheon/repair/**'
          )

          echo "scenario_id=${ref//\//-}" >> "$GITHUB_OUTPUT"
          echo "config_path=pantheon.alpha.json" >> "$GITHUB_OUTPUT"
          echo "artifact_mode=public" >> "$GITHUB_OUTPUT"
          echo "post_comment=true" >> "$GITHUB_OUTPUT"
          echo "audit_mode=auto" >> "$GITHUB_OUTPUT"

          case "$ref" in
            std/s4-*)
              mode="boundary"
              fail_on="fail,requires_contract,requires_replan,requires_scope_expansion,sanitizer_violation"
              review_lines+=('docs/**')
              ;;
            std/*)
              mode="boundary"
              fail_on="all"
              ;;
            chg/*)
              mode="change"
              change_id="chg_301581a3e2a42b6d"
              fail_on="fail,requires_contract,requires_replan,requires_scope_expansion,sanitizer_violation"
              ;;
            rep/r2-*)
              mode="repair"
              repair_id="repair_07762ff9a604ae54"
              fail_on="fail,requires_replan,requires_scope_expansion,sanitizer_violation"
              ;;
            rep/*)
              mode="repair"
              repair_intent="Fix formatting regression in formatValue"
              fail_on="fail,requires_replan,requires_scope_expansion,sanitizer_violation"
              ;;
            arch/*)
              mode="change"
              change_id="chg_cae36ddd85ac4a77"
              fail_on="fail,requires_contract,requires_replan,requires_scope_expansion,sanitizer_violation"
              ;;
            *)
              echo "Unknown hosted scenario branch: $ref" >&2
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "fail_on=$fail_on" >> "$GITHUB_OUTPUT"
          if [ -n "$change_id" ]; then
            echo "change_id=$change_id" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$repair_id" ]; then
            echo "repair_id=$repair_id" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$repair_intent" ]; then
            echo "repair_intent=$repair_intent" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "scope<<__PANTHEON__"
            printf '%s\n' "${scope_lines[@]}"
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "review<<__PANTHEON__"
            printf '%s\n' "${review_lines[@]}"
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "forbid<<__PANTHEON__"
            printf '%s\n' "${forbid_lines[@]}"
            echo "__PANTHEON__"
          } >> "$GITHUB_OUTPUT"

          if [ "$mode" = "repair" ] && [ -n "$repair_intent" ]; then
            {
              echo "suspect<<__PANTHEON__"
              printf '%s\n' 'src/utils/format.ts'
              echo "__PANTHEON__"
            } >> "$GITHUB_OUTPUT"
            {
              echo "failing_tests<<__PANTHEON__"
              printf '%s\n' 'tests/utils/format.test.ts'
              echo "__PANTHEON__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize seeded change contract base sha
        if: startsWith(github.head_ref, 'chg/') || startsWith(github.head_ref, 'arch/')
        shell: bash
        run: |
          contract_dir=".pantheon/change/runs/${{ steps.scenario.outputs.change_id }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ ! -d "$contract_dir" ]; then
            echo "Expected seeded change contract directory missing: $contract_dir" >&2
            exit 1
          fi
          node - "$contract_dir" "$base_sha" <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const [contractDir, baseSha] = process.argv.slice(2);
          for (const name of ["change_contract.latest.json", "change_contract.rev1.json"]) {
            const file = path.join(contractDir, name);
            if (!fs.existsSync(file)) continue;
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            doc.repo_state = {
              ...doc.repo_state,
              base_sha: baseSha,
              head_sha: baseSha,
              diff_base: baseSha,
            };
            fs.writeFileSync(file, `${JSON.stringify(doc, null, 2)}\n`);
          }
          EOF

      - name: Run Pantheon governance gate
        id: pantheon
        uses: ./action
        with:
          mode: ${{ steps.scenario.outputs.mode }}
          change_id: ${{ steps.scenario.outputs.change_id }}
          repair_id: ${{ steps.scenario.outputs.repair_id }}
          repair_intent: ${{ steps.scenario.outputs.repair_intent }}
          suspect: ${{ steps.scenario.outputs.suspect }}
          failing_tests: ${{ steps.scenario.outputs.failing_tests }}
          scope: ${{ steps.scenario.outputs.scope }}
          review: ${{ steps.scenario.outputs.review }}
          forbid: ${{ steps.scenario.outputs.forbid }}
          config_path: ${{ steps.scenario.outputs.config_path }}
          fail_on: ${{ steps.scenario.outputs.fail_on }}
          artifact_mode: ${{ steps.scenario.outputs.artifact_mode }}
          post_comment: ${{ steps.scenario.outputs.post_comment }}
          audit_mode: ${{ steps.scenario.outputs.audit_mode }}

      - name: Resolve artifact dir
        if: always()
        id: artifacts
        shell: bash
        run: |
          dir="${{ steps.pantheon.outputs.artifact_dir }}"
          if [ -z "$dir" ]; then
            if [ -d pantheon-repair-report ]; then
              dir="pantheon-repair-report"
            else
              dir="pantheon-report"
            fi
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload hosted evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.scenario.outputs.scenario_id }}
          path: ${{ steps.artifacts.outputs.dir }}
