name: Pantheon Repair Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".pantheon/repair/inbox/agent_bug_report.json"
      - ".pantheon/repair/runs/**"
      - "src/**"
      - "test/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pantheon-repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./action
        id: pantheon
        with:
          mode: repair
          agent_bug_report: .pantheon/repair/inbox/agent_bug_report.json
          artifact_mode: public
          post_comment: true
          fail_on: fail,requires_replan,requires_scope_expansion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantheon-repair-report
          path: ${{ steps.pantheon.outputs.artifact_dir }}
